[build]
  command = "cd book-admin/frontend && npm ci && npm run build"
  publish = "book-admin/build"

[[redirects]]
  from = "/api/*"
  to = "https://shuspot.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/build/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200