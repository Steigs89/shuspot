[build]
  publish = "build"
  # We ship prebuilt assets in the repo. No build needed on Netlify.
  command = "echo Using prebuilt build/ folder"

[[redirects]]
  from = "/api/*"
  to = "https://shuspot.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback handled by build/_redirects (/* -> /index.html)